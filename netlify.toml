[build]
  command = "npm run build"
  publish = "public"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["serverless-http", "firebase-admin", "google-auth-library"]
  included_files = ["admin-auth.json", "config.json", "database.rules.json", "bundled-assets.json", "index.html", "mastercard-logo.png", "firebase-messaging-sw.js"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/media/*"
  to = "/.netlify/functions/api/media/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = false
